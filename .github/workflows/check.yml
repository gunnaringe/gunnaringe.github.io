name: Check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate HTML
        run: npx --yes html-validate@9 "site/**/*.html" "redirect/*.html"

      - name: Build
        run: ./build.sh

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers automated requests with HTTP 999.
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/dist"
            --exclude "linkedin\.com"
            --exclude "^https://gunnaringe\.sort\.land"
            "dist/**/*.html" "redirect/*.html"
          fail: true
